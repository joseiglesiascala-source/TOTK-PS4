name: Build TOTK PS4 PKG

on:
  workflow_dispatch: # Esto te permite ejecutarlo manualmente desde la pestaña "Actions"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Aquí irían los pasos para preparar el juego (prod.keys, etc.).
      # Debes subir tus archivos necesarios al repositorio o usar "secrets".
      # Por seguridad, NO subas archivos con copyright.

      - name: Ejecutar toolchain de OpenOrbis
        uses: OpenOrbis/toolchain-action@main
        with:
          version: v0.5.1

      - name: Compilar el motor (rebuild)
        run: |
          # Asegúrate de que los scripts sean ejecutables
          chmod +x scripts/*.sh
          # Ejecuta el script de compilación (revisa BUILDING.md para el comando exacto)
          ./scripts/rebuild-totk.sh

      - name: Empaquetar el PKG
        run: |
          # Genera el archivo .pkg
          ./scripts/package-totk.sh

      - name: Subir el PKG como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TOTK-PS4-PKG
          path: out/*.pkg # Ajusta la ruta si es diferente